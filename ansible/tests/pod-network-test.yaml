---
apiVersion: v1
kind: Pod
metadata:
  name: net-server
  namespace: pod-net-test
spec:
  nodeSelector:
    kubernetes.io/hostname: kube-3
  containers:
    - name: server
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          mkdir -p /tmp/www
          echo "Hello from kube-3!" > /tmp/www/index.html
          httpd -f -p 8080 -h /tmp/www
---
apiVersion: v1
kind: Pod
metadata:
  name: net-client
  namespace: pod-net-test
spec:
  nodeSelector:
    kubernetes.io/hostname: kube-2
  containers:
    - name: client
      image: busybox:1.36
      command:
        - sh
        - -c
        - sleep 3600
