---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: net-server-httproute
  namespace: pod-net-test

spec:
  parentRefs:
  - name: traefik-gateway
    namespace: traefik
    sectionName: web

  - name: traefik-gateway
    namespace: traefik
    sectionName: websecure

  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: net-server-svc
      port: 8080