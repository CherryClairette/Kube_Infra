---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: net-server-httproute
  namespace: pod-net-test
spec:
  parentRefs:
  - name: traefik-gateway
    namespace: traefik
  rules:
  - matches:
    - path:
        value: /
    backendRefs:
    - name: net-server-svc
      port: 8080