---
- name: Install nftables
  ansible.builtin.dnf:
    name: nftables
    state: present

- name: Create nftables drop-in directory
  ansible.builtin.file:
    path: /etc/nftables.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure public web port forwarding
  ansible.builtin.copy:
    dest: /etc/nftables.d/kube-traefik.nft
    owner: root
    group: root
    mode: "0644"
    content: |
      # Recreated from scratch on each load, so it never duplicates rules
      add table ip kube_traefik
      delete table ip kube_traefik
      table ip kube_traefik {
        chain prerouting {
          type nat hook prerouting priority dstnat; policy accept;
          tcp dport 80 redirect to :30080
          tcp dport 443 redirect to :30443
        }
      }
  notify: Load kube-traefik nftables rules

- name: Include nftables drop-ins at boot
  ansible.builtin.lineinfile:
    path: /etc/sysconfig/nftables.conf
    regexp: '^include "/etc/nftables\.d/\*\.nft"$'
    line: 'include "/etc/nftables.d/*.nft"'
    insertafter: EOF
    create: true
    owner: root
    group: root
    mode: "0600"

- name: Enable nftables
  ansible.builtin.systemd:
    name: nftables
    enabled: true
    state: started