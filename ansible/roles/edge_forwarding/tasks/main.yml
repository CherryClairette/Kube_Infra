---
- name: Install nftables
  ansible.builtin.apt:
    name: nftables
    state: present
    update_cache: true

- name: Create nftables drop-in directory
  ansible.builtin.file:
    path: /etc/nftables.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure public web port forwarding
  ansible.builtin.copy:
    dest: /etc/nftables.d/kube-traefik.nft
    owner: root
    group: root
    mode: "0644"
    content: |
      table ip kube_traefik {
        chain prerouting {
          type nat hook prerouting priority dstnat; policy accept;
          tcp dport 80 redirect to :30080
          tcp dport 443 redirect to :30443
        }
      }
  notify: Reload nftables

- name: Include nftables drop-ins
  ansible.builtin.lineinfile:
    path: /etc/nftables.conf
    regexp: '^include "/etc/nftables\.d/\*\.nft"$'
    line: 'include "/etc/nftables.d/*.nft"'
    insertafter: EOF
  notify: Reload nftables

- name: Enable nftables
  ansible.builtin.systemd:
    name: nftables
    enabled: true
    state: started
