providers:
  kubernetesIngress:
    enabled: false
  kubernetesGateway:
    enabled: true

gateway:
  listeners:
    web:
      port: 80
      protocol: HTTP
      namespacePolicy:
        from: All

  websecure:
    port: 8443
    protocol: HTTPS
    hostname: app.13.135.22.141.sslip.io
    namespacePolicy:
      from: All
    mode: Terminate
    certificateRef:
      - kind: Secret
        name: net-server-staging-tls

service:
  spec:
    type: NodePort

ports:
  web:
    port: 80
    nodePort: 30080

  websecure:
    port: 8443
    nodePort: 31345