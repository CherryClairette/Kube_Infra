---
- name: Prepare all Kubernetes nodes
  hosts: kubernetes
  become: true

  roles:
    - common
    - containerd
    - kubernetes

- name: Initialize Kubernetes control plane
  hosts: control_plane
  become: true

  roles:
    - control_plane

- name: Join Kubernetes workers
  hosts: join_workers
  become: true

  roles:
    - join_workers

- name: Install Cilium networking
  hosts: control_plane
  become: true
  roles:
    - cilium

- name: Install Argo CD and apply the bootstrap manifests
  hosts: control_plane
  become: true
  roles:
    - role: argocd
      tags: [argocd]
    - role: edge_forwarding
      tags: [edge_forwarding]