apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: traefik-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "30"
  labels:
    app.kubernetes.io/name: traefik-gateway
    app.kubernetes.io/part-of: gateway-api-test
    app.kubernetes.io/managed-by: argocd
spec:
  gatewayClassName: traefik
  listeners:
    - name: web
      protocol: HTTP
      port: 8000
      hostname: app.13.135.22.141.sslip.io
      allowedRoutes:
        namespaces:
          from: All
    - name: websecure
      protocol: HTTPS
      port: 8443
      hostname: app.13.135.22.141.sslip.io
      tls:
        mode: Terminate
        certificateRefs:
          - name: whoami-staging-tls
            namespace: traefik-tls
      allowedRoutes:
        namespaces:
          from: Same
