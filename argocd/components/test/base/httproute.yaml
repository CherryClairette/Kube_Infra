apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami
  annotations:
    argocd.argoproj.io/sync-wave: "40"
  labels:
    app.kubernetes.io/name: whoami
    app.kubernetes.io/part-of: gateway-api-test
    app.kubernetes.io/managed-by: argocd
spec:
  parentRefs:
    - name: traefik-gateway
  hostnames:
    - app.13.135.22.141.sslip.io
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: whoami
          port: 80
