apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https-redirect
  annotations:
    argocd.argoproj.io/sync-wave: "40"
  labels:
    app.kubernetes.io/name: http-to-https-redirect
    app.kubernetes.io/part-of: gateway-api-test
    app.kubernetes.io/managed-by: argocd
spec:
  parentRefs:
    - name: traefik-gateway
      sectionName: web
  hostnames:
    - app.13.135.22.141.sslip.io
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: app.13.135.22.141.sslip.io
            port: 443
            statusCode: 301
