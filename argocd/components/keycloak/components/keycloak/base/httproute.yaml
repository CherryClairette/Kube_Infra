apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: identity-provider
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure-keycloak
  hostnames:
    - keycloak.13.135.22.141.sslip.io
  rules:
    - backendRefs:
        - name: keycloak
          port: 8080
