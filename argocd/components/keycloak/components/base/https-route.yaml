apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak-https
  annotations:
    argocd.argoproj.io/sync-wave: "40"
  labels:
    app.kubernetes.io/name: keycloak-https
    app.kubernetes.io/component: identity-provider
spec:
  parentRefs:
    - name: dev-traefik-gateway
      namespace: traefik
      sectionName: websecure-keycloak
  hostnames:
    - keycloak.13.135.22.141.sslip.io
  rules:
    - backendRefs:
        - name: keycloak
          port: 8080