apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak-http-redirect
  annotations:
    argocd.argoproj.io/sync-wave: "40"
  labels:
    app.kubernetes.io/name: keycloak-http-redirect
    app.kubernetes.io/component: identity-provider
spec:
  parentRefs:
    - name: dev-traefik-gateway
      namespace: traefik
      sectionName: web-keycloak
  hostnames:
    - keycloak.13.135.22.141.sslip.io
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: keycloak.13.135.22.141.sslip.io
            port: 443
            statusCode: 301