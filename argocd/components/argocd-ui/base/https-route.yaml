apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-https
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "40"
  labels:
    app.kubernetes.io/name: argocd-https
    app.kubernetes.io/part-of: argocd
    app.kubernetes.io/managed-by: argocd
spec:
  parentRefs:
    - name: dev-traefik-gateway
      namespace: argocd-test-dev
      sectionName: websecure-argocd
  hostnames:
    - argocd.13.135.22.141.sslip.io
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
