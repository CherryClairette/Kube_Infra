apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-http-redirect
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "40"
  labels:
    app.kubernetes.io/name: argocd-http-redirect
    app.kubernetes.io/part-of: argocd
    app.kubernetes.io/managed-by: argocd
spec:
  parentRefs:
    - name: dev-traefik-gateway
      namespace: argocd-test-dev
      sectionName: web-argocd
  hostnames:
    - argocd.13.135.22.141.sslip.io
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: argocd.13.135.22.141.sslip.io
            port: 443
            statusCode: 301
