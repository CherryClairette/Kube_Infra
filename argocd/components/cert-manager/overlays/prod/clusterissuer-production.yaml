apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  labels:
    app.kubernetes.io/name: letsencrypt-production
    app.kubernetes.io/part-of: cert-manager
    app.kubernetes.io/managed-by: argocd
spec:
  acme:
    email: buket-meltem.ozkan@epitech.eu
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-production-account-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            serviceType: ClusterIP
            parentRefs:
              - name: dev-traefik-gateway
                namespace: argocd-test-dev
                kind: Gateway
                sectionName: web
      - selector:
          dnsNames:
            - argocd.13.135.22.141.sslip.io
        http01:
          gatewayHTTPRoute:
            serviceType: ClusterIP
            parentRefs:
              - name: dev-traefik-gateway
                namespace: argocd-test-dev
                kind: Gateway
                sectionName: web-argocd
