apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: allow-dev-gateway-tls
  namespace: traefik-tls
  annotations:
    argocd.argoproj.io/sync-wave: "30"
  labels:
    app.kubernetes.io/name: allow-dev-gateway-tls
    app.kubernetes.io/part-of: cert-manager
    app.kubernetes.io/managed-by: argocd
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: argocd-test-dev
  to:
    - group: ""
      kind: Secret
      name: whoami-staging-tls
