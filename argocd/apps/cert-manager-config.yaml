apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
    # Dry-run manifests and then compare the result with the live cluster state. 
    # This is useful for detecting changes made by mutation webhooks, which are not visible in the manifests.
    argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true
  labels:
    app.kubernetes.io/name: cert-manager-config
    app.kubernetes.io/part-of: platform
    app.kubernetes.io/managed-by: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:CherryClairette/Kube_Infra.git
    targetRevision: feat/argo-cd
    path: argocd/components/cert-manager/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
