apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "30"
  labels:
    app.kubernetes.io/name: traefik-gateway
    app.kubernetes.io/part-of: platform
    app.kubernetes.io/managed-by: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:CherryClairette/Kube_Infra.git
    targetRevision: feat/argo-cd
    path: argocd/components/networking/gateway/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
