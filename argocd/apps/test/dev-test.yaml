apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-test-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "40"
spec:
  project: default
  source:
    repoURL: git@github.com:CherryClairette/Kube_Infra.git
    targetRevision: feat/argo-cd
    path: argocd/components/test/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd-test-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
