apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: security
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:CherryClairette/Kube_Infra.git
    targetRevision: feat/argo-cd
    path: argocd/components/security/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: security
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true